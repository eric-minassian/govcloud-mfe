packages:
  - apps/*
  - packages/*
  - services/*
  - tools/*
  - infra

allowBuilds:
  esbuild: true

# One version of every shared dependency for the whole repo. This matters more
# than usual for Module Federation: the shell provides singletons (react,
# react-query, ...) at runtime, so remotes must be built against the same
# major versions. Bumping a catalog entry is a platform-wide change.
catalog:
  # Runtime singletons shared across federated modules
  react: ^19.3.1
  react-dom: ^19.3.1
  react-router: ^8.5.0
  "@tanstack/react-query": ^5.105.0
  "@tanstack/react-query-devtools": ^5.105.0
  # Build tooling
  "@module-federation/enhanced": ^2.9.2
  "@module-federation/rsbuild-plugin": ^2.9.2
  "@rsbuild/core": ^2.2.14
  "@rsbuild/plugin-react": ^2.1.1
  "@biomejs/biome": ^2.6.3
  turbo: ^2.11.10
  typescript: ^7.0.2
  tsx: ^4.23.15
  esbuild: ^0.28.2
  vitest: ^5.0.5
  jsdom: ^30.1.3
  "@testing-library/react": ^16.3.3
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@types/node": ^26.6.5
  # AWS
  aws-cdk-lib: ^2.275.0
  aws-cdk: ^2.1146.1
  constructs: ^10.8.1
  "@aws-sdk/client-s3": ^3.1157.0
  "@aws-sdk/client-ssm": ^3.1157.0
  "@aws-sdk/credential-providers": ^3.1157.0
  aws-sdk-client-mock: ^4.1.0
  commander: ^15.0.0

# Added by pnpm's minimum-release-age supply-chain check for packages that were
# newer than the threshold at install time. Safe to prune as they age.
minimumReleaseAgeExclude:
  - "@aws-sdk/checksums@3.1001.6"
  - "@aws-sdk/client-s3@3.1157.0"
  - "@aws-sdk/client-ssm@3.1157.0"
  - "@aws-sdk/core@3.978.6"
  - "@aws-sdk/credential-provider-cognito-identity@3.972.76"
  - "@aws-sdk/credential-provider-env@3.972.77"
  - "@aws-sdk/credential-provider-http@3.972.79"
  - "@aws-sdk/credential-provider-ini@3.973.22"
  - "@aws-sdk/credential-provider-login@3.972.84"
  - "@aws-sdk/credential-provider-node@3.972.89"
  - "@aws-sdk/credential-provider-process@3.972.77"
  - "@aws-sdk/credential-provider-sso@3.973.21"
  - "@aws-sdk/credential-provider-web-identity@3.972.83"
  - "@aws-sdk/credential-providers@3.1157.0"
  - "@aws-sdk/middleware-sdk-s3@3.972.82"
  - "@aws-sdk/nested-clients@3.997.51"
  - "@aws-sdk/token-providers@3.1157.0"
  - "@smithy/core@3.37.0"
  - "@smithy/node-http-handler@4.13.0"
  - "@tanstack/query-core@5.105.0"
  - "@tanstack/query-devtools@5.105.0"
  - "@tanstack/react-query-devtools@5.105.0"
  - "@tanstack/react-query@5.105.0"
  - aws-cdk-lib@2.275.0
