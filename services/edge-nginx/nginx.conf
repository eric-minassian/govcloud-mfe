# Runs as the image's unprivileged user. Everything nginx writes goes to /tmp or
# /var/cache/nginx, which are mounted as writable volumes; the rest of the filesystem is read-only.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  default_type application/octet-stream;
  server_tokens off;
  sendfile on;

  # Must exceed the ALB idle timeout (60s) so nginx never closes a connection the ALB is about
  # to reuse, which would surface as sporadic 502s.
  keepalive_timeout 75s;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  # One JSON object per request, so CloudWatch Logs Insights can query fields directly.
  # The trace id ties a request to the ALB access log entry for the same request.
  log_format json escape=json
    '{"time":"$time_iso8601","method":"$request_method","uri":"$uri","status":$status,'
    '"bytes":$body_bytes_sent,"duration":$request_time,"upstream_status":"$upstream_status",'
    '"upstream_duration":"$upstream_response_time","cache":"$upstream_cache_status",'
    '"trace_id":"$http_x_amzn_trace_id","user_agent":"$http_user_agent"}';
  access_log /dev/stdout json;

  # S3 stores objects uncompressed; compress on the way out.
  gzip on;
  gzip_proxied any;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

  # Rendered from /etc/nginx/templates/nginx.d/*.template at container start.
  include /tmp/nginx.d/*.conf;
}
