# Settings for proxying a request to the artifact bucket.
#
# nginx sends *unsigned* requests. The bucket policy allows anonymous s3:GetObject on `builds/*`
# and `index.html` only when the request arrives through this VPC's S3 gateway endpoint, so
# these requests succeed from the ECS tasks and nowhere else. Release records stay private.

proxy_http_version 1.1;
proxy_set_header Host $s3_host;
proxy_set_header Connection "";

# Never forward the user's session or identity to S3.
proxy_set_header Cookie "";
proxy_set_header Authorization "";
proxy_set_header X-Amzn-Oidc-Data "";
proxy_set_header X-Amzn-Oidc-Accesstoken "";
proxy_set_header X-Amzn-Oidc-Identity "";

proxy_ssl_server_name on;
proxy_ssl_name $s3_host;
proxy_ssl_verify on;
proxy_ssl_verify_depth 3;
proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
proxy_ssl_protocols TLSv1.2 TLSv1.3;

# Don't leak S3 implementation details; each location sets its own Cache-Control.
proxy_hide_header x-amz-id-2;
proxy_hide_header x-amz-request-id;
proxy_hide_header x-amz-version-id;
proxy_hide_header x-amz-server-side-encryption;
proxy_hide_header x-amz-bucket-region;
proxy_hide_header Set-Cookie;
proxy_hide_header Cache-Control;
proxy_ignore_headers Set-Cookie Cache-Control Expires;

# Lets each location map S3's 403/404 to its own response with `error_page`.
proxy_intercept_errors on;
