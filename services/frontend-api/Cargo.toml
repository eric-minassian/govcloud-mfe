[package]
name = "frontend-api"
version = "0.1.0"
edition = "2024"
publish = false
description = "Same-origin API for the micro-frontend shell: session, module registry, feature flags, preferences and client telemetry."

[dependencies]
anyhow = "1"
async-trait = "0.1"
aws-config = { version = "1", default-features = false, features = ["behavior-version-latest", "rt-tokio", "default-https-client"] }
aws-sdk-s3 = { version = "1", default-features = false, features = ["behavior-version-latest", "rt-tokio", "default-https-client"] }
axum = "0.8"
base64 = "0.23"
futures = "0.3"
p256 = { version = "0.14", features = ["ecdsa", "pem"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "fs", "sync", "time"] }
tower-http = { version = "0.7", features = ["trace", "timeout", "limit", "set-header", "csrf"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[dev-dependencies]
p256 = { version = "0.14", features = ["ecdsa", "pem", "getrandom"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
